name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing root release tag
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify SemVer tag and package.json, Cargo.toml, pyproject.toml versions
        id: meta
        run: node scripts/check-release-tag.mjs
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal
      - name: Check
        run: make check
      - name: Check published versions
        id: published
        run: |
          version="${RELEASE_TAG#v}"
          if npm view "@kitup/sdk@${version}" version >/dev/null 2>&1; then
            echo "npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm=false" >> "$GITHUB_OUTPUT"
          fi
          if curl -A "kitup-release" -fsS "https://crates.io/api/v1/crates/kitup/${version}" >/dev/null 2>&1; then
            echo "crate=true" >> "$GITHUB_OUTPUT"
          else
            echo "crate=false" >> "$GITHUB_OUTPUT"
          fi
          if curl -fsS "https://pypi.org/pypi/kitup-sdk/${{ steps.meta.outputs.python_version }}/json" >/dev/null 2>&1; then
            echo "pypi=true" >> "$GITHUB_OUTPUT"
          else
            echo "pypi=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dry run npm package
        if: steps.published.outputs.npm != 'true'
        run: |
          cd ts
          npm pack --dry-run
      - name: Dry run crate
        if: steps.published.outputs.crate != 'true'
        run: |
          cd rust
          cargo publish --locked --dry-run
      - name: Build Python package
        if: steps.published.outputs.pypi != 'true'
        run: uv build --directory python
      - name: Publish Go core module tag
        run: |
          version="${RELEASE_TAG#v}"
          release_sha="$(git rev-parse HEAD)"
          go_tag="go/v${version}"
          if git rev-parse -q --verify "refs/tags/${go_tag}" >/dev/null; then
            test "$(git rev-list -n 1 "${go_tag}")" = "$release_sha"
          else
            git tag "$go_tag" "$release_sha"
            git push origin "refs/tags/${go_tag}"
          fi
      - name: Verify Go Cobra against published core
        run: node scripts/check-go-modules.mjs --published-core
        env:
          GOPROXY: direct
          GONOSUMDB: github.com/lathe-cli/kitup/go
      - name: Publish Go Cobra module tag
        run: |
          version="${RELEASE_TAG#v}"
          release_sha="$(git rev-parse HEAD)"
          go_tag="go-cobra/v${version}"
          if git rev-parse -q --verify "refs/tags/${go_tag}" >/dev/null; then
            test "$(git rev-list -n 1 "${go_tag}")" = "$release_sha"
          else
            git tag "$go_tag" "$release_sha"
            git push origin "refs/tags/${go_tag}"
          fi
      - name: Publish npm package
        if: steps.published.outputs.npm != 'true'
        run: |
          cd ts
          args=(--access public --provenance)
          if [[ -n "$RELEASE_STAGE" ]]; then
            args+=(--tag "$RELEASE_STAGE")
          fi
          npm publish "${args[@]}"
        env:
          RELEASE_STAGE: ${{ steps.meta.outputs.stage }}
      - name: Authenticate with crates.io
        if: steps.published.outputs.crate != 'true'
        id: crate_auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crate
        if: steps.published.outputs.crate != 'true'
        run: |
          cd rust
          cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crate_auth.outputs.token }}
      - name: Publish Python package
        if: steps.published.outputs.pypi != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
      - name: Create GitHub release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          previous_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^ | grep -E '^v[0-9]')"
          test -n "$previous_tag"
          args=(--verify-tag --title "$RELEASE_TAG" --generate-notes --notes-start-tag "$previous_tag")
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
      - name: Smoke published packages
        run: |
          scripts/smoke-release.sh "${RELEASE_TAG#v}"
